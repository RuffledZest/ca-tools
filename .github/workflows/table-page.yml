# After every push to main: regenerate the R data file and the generated
# counts in table/README.md from table/ca_table.csv, rebuild the page
# docs/index.html (served by GitHub Pages from docs/ on main), run the
# consistency checks and the self-test, and commit what changed. If a check
# fails the run turns red, GitHub emails the person who pushed, and nothing
# is committed.

name: Table page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: table-page
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Regenerate table/ca_table.rda if its content differs from the CSV
        run: |
          Rscript -e 'source("table/ca_table.R"); x <- load_ca_table("table/ca_table.csv"); e <- new.env(); same <- file.exists("table/ca_table.rda") && { load("table/ca_table.rda", envir = e); identical(x, e$ca_table) }; if (same) cat("rda current\n") else { make_rda("table/ca_table.csv", "table/ca_table.rda"); cat("rda regenerated\n") }'
      - name: Regenerate the counts in table/README.md
        run: python3 tools/consistency.py --write
      - name: Render docs/index.html
        run: python3 tools/render_table.py --table-dir table --out docs/index.html --date "$(date -u +%F)"
      - name: Check (consistency and self-test)
        run: |
          python3 tools/consistency.py --check
          python3 tools/check_submission.py --selftest --table-dir table > /dev/null
      - name: Commit what changed
        run: |
          git add docs/index.html table/README.md table/ca_table.rda
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "ca-table-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Regenerate table page, counts and R data file"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
